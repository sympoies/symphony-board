vulnerabilities:
  - id: GHSA-wrw7-89jp-8q8g
    paths:
      - packages/android/src-tauri/Cargo.lock
      - packages/desktop-standalone/src-tauri/Cargo.lock
      - packages/desktop/src-tauri/Cargo.lock
    expired_at: 2027-01-15
    statement: >-
      No compatible fix in Tauri 2.12.7: its Linux GTK3 dependency (gtk
      0.18.2) requires glib 0.18, and the first fixed glib release is 0.20.0.
      This dependency is not built for the shipped macOS or Android targets.
