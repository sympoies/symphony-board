name: publish-image

# Publish release artifacts on a GitHub Release: public backend daemon and
# read-only UI sidecar images to GHCR, plus unsigned macOS desktop app bundles.
# The Docker workflow smoke-tests local amd64 images before pushing multi-arch
# linux/amd64 + linux/arm64 manifests.
on:
  release:
    types: [published]
  # Manual runs exist so a change to THIS FILE can be tested. Before it, the only
  # way to exercise the workflow was to publish a release, which meant every
  # workflow edit shipped unverified -- and one of them (an arm64 build dying
  # under QEMU) cost a release before it was caught.
  #
  # A manual run publishes NOTHING unless asked: it builds, smoke-tests, and
  # stops. `push` is what turns it into a real publication, and the downstream
  # deploy and Homebrew dispatches never fire from here at all.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build, e.g. v1.23.0"
        required: true
        type: string
      push:
        description: "Push images to GHCR. Leave off to build and smoke-test only."
        required: false
        default: false
        type: boolean

concurrency:
  # Key on the tag being built, not on the ref that triggered the run: a manual
  # run's ref is a branch, so a `push=true` run for vX.Y.Z would otherwise sit
  # in a different group than the release run for the same tag and race it --
  # both pushing the same GHCR tags, both clobbering the same release assets.
  # Spelled out rather than `env.RELEASE_TAG`: `concurrency` is evaluated
  # before the env context exists.
  group: publish-image-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

permissions: {}

# The release event is empty on a manual run, so resolve both facts once here
# rather than letting each step guess. RELEASE_TAG is what gets built and
# verified; PUBLISH gates every side effect that outlives the run.
env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
  PUBLISH: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}
  # A manual run has no release payload, so `!github.event.release.prerelease`
  # would read as "not a prerelease" and move `latest`. It may only do that on a
  # real release that is publishing.
  MOVE_LATEST: ${{ github.event_name == 'release' && !github.event.release.prerelease }}

jobs:
  # Gate the published tag against the repo's version files BEFORE anything is
  # published. publish and desktop run in parallel with no ordering, and publish
  # pushes the public GHCR tags with `push: true`; without this prerequisite a
  # manual/retagged release whose tag drifts from package.json would move the
  # container tags and only then fail in desktop packaging, leaving a partially
  # published release. Failing here blocks both downstream jobs first.
  version-gate:
    name: gate release tag vs package.json
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          # On a manual run the triggering ref is a branch; the tag is the
          # input. Fully qualified, so a BRANCH named like the tag can never be
          # resolved here -- `tag` is free text and this ref is what gets built.
          ref: refs/tags/${{ env.RELEASE_TAG }}

      # The checkout above already refuses a non-tag ref, but it fails with
      # git's "couldn't find remote ref" rather than saying what is wrong. This
      # is the readable failure, and it states the input's contract: an
      # EXISTING tag, which is the only thing a release can be built from.
      - name: Require an existing tag
        run: |
          set -euo pipefail

          if ! git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null; then
            echo "not an existing tag: $RELEASE_TAG" >&2
            echo "publish-image builds a released tag; it cannot build a branch or an arbitrary ref" >&2
            exit 1
          fi
          echo "building existing tag: $RELEASE_TAG"

      - name: Check release version
        run: scripts/check-release-version.sh "$RELEASE_TAG"

  publish:
    name: build, smoke-test, push to GHCR
    needs: version-gate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          # On a manual run the triggering ref is a branch; the tag is the
          # input. Fully qualified, so a BRANCH named like the tag can never be
          # resolved here -- `tag` is free text and this ref is what gets built.
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (board)
        id: board_meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}
            type=raw,value=latest,enable=${{ env.MOVE_LATEST == 'true' && env.PUBLISH == 'true' }}

      - name: Docker metadata (web)
        id: web_meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-web
          tags: |
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}
            type=raw,value=latest,enable=${{ env.MOVE_LATEST == 'true' && env.PUBLISH == 'true' }}

      - name: Build board amd64 for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: symphony-board:smoke
          cache-from: type=gha,scope=board
          cache-to: type=gha,mode=max,scope=board

      - name: Build web amd64 for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/ui.Dockerfile
          platforms: linux/amd64
          load: true
          tags: symphony-board-web:smoke
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Smoke test images
        run: |
          set -euo pipefail

          docker run --rm --entrypoint node \
            -v "$PWD/packages/ui/public/contract.json:/tmp/sample-contract.json:ro" \
            symphony-board:smoke \
            --disable-warning=ExperimentalWarning src/cli/validate-contract.ts \
            --in /tmp/sample-contract.json

          docker run --rm --entrypoint node symphony-board:smoke \
            -e "import('postgres').then(()=>console.log('postgres runtime import ok'))"

          smoke_dir="$(mktemp -d)"
          cleanup() {
            docker rm -f symphony-board-web-smoke >/dev/null 2>&1 || true
            rm -rf "$smoke_dir"
          }
          trap cleanup EXIT

          cp config/sources.example.json "$smoke_dir/sources.json"
          mkdir -p "$smoke_dir/data"
          # The board image runs as non-root (uid 1000); the bind-mounted host
          # data dir (owned by the runner user) must be writable by it.
          chmod 0777 "$smoke_dir/data"
          docker run --rm \
            -v "$smoke_dir/sources.json:/app/config/sources.json:ro" \
            -v "$smoke_dir/data:/app/data" \
            symphony-board:smoke --dry-run
          test -s "$smoke_dir/data/contract.json"

          if docker run --rm --entrypoint node symphony-board:smoke \
            --disable-warning=ExperimentalWarning src/cli/validate-contract.ts \
            --in /app/data/contract.json \
            2>/dev/null; then
              echo "unexpected: image should not contain runtime /app/data/contract.json" >&2
              exit 1
          fi

          docker run --rm symphony-board-web:smoke \
            sh -c 'test ! -e /usr/share/nginx/html/contract.json'

          docker run -d --rm --name symphony-board-web-smoke \
            --add-host board:127.0.0.1 \
            --add-host api:127.0.0.1 \
            --add-host live:127.0.0.1 \
            -p 8080:8080 \
            -v "$PWD/packages/ui/public/contract.json:/srv/data/contract.json:ro" \
            symphony-board-web:smoke
          for _ in $(seq 1 30); do
            # Read the body to a file before grepping: piping `curl | grep -q` lets
            # grep close the pipe on its first match, and with `set -o pipefail`
            # curl's resulting EPIPE (exit 23) fails the whole condition. Harmless
            # for a tiny body, but the demo contract grew past the pipe buffer (~240KB)
            # so curl reliably loses the write race and the check never passed.
            if curl -fsS http://127.0.0.1:8080/ >/dev/null &&
               curl -fsS http://127.0.0.1:8080/contract.json -o "$smoke_dir/web-contract.json" &&
               grep -q '"contract_version":' "$smoke_dir/web-contract.json"; then
              exit 0
            fi
            sleep 1
          done
          docker logs symphony-board-web-smoke || true
          exit 1

      - name: Build and push board multi-arch
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.board_meta.outputs.tags }}
          labels: ${{ steps.board_meta.outputs.labels }}
          cache-from: type=gha,scope=board
          cache-to: type=gha,mode=max,scope=board

      - name: Build and push web multi-arch
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/ui.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.web_meta.outputs.tags }}
          labels: ${{ steps.web_meta.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Verify public GHCR manifests
        if: ${{ env.PUBLISH == 'true' }}
        run: |
          set -euo pipefail

          token_for() {
            local image_path="$1"
            curl -fsSL \
              "https://ghcr.io/token?service=ghcr.io&scope=repository:${image_path}:pull" |
              python3 -c 'import json, sys; data = json.load(sys.stdin); print(data.get("token") or data.get("access_token") or "")'
          }

          platforms_for() {
            python3 -c 'import json, sys
          data = json.load(sys.stdin)
          platforms = []
          for item in data.get("manifests") or []:
              platform = item.get("platform") or {}
              os = platform.get("os")
              arch = platform.get("architecture")
              if os and arch:
                  platforms.append(f"{os}/{arch}")
          print(" ".join(platforms))'
          }

          verify_ref() {
            local image_ref="$1"
            local image_path tag token manifest platforms

            image_ref="${image_ref#ghcr.io/}"
            image_path="${image_ref%:*}"
            tag="${image_ref##*:}"

            token="$(token_for "$image_path")"
            test -n "$token"
            manifest="$(curl -fsSL \
              -H "Authorization: Bearer $token" \
              -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json' \
              "https://ghcr.io/v2/${image_path}/manifests/${tag}")"
            platforms="$(printf '%s' "$manifest" | platforms_for)"

            case " $platforms " in
              *" linux/amd64 "*) ;;
              *)
                echo "missing linux/amd64 for ghcr.io/${image_path}:${tag} (platforms: ${platforms:-none})" >&2
                exit 1
                ;;
            esac
            case " $platforms " in
              *" linux/arm64 "*) ;;
              *)
                echo "missing linux/arm64 for ghcr.io/${image_path}:${tag} (platforms: ${platforms:-none})" >&2
                exit 1
                ;;
            esac

            echo "verified public GHCR manifest: ghcr.io/${image_path}:${tag} (${platforms})"
          }

          {
            printf '%s\n' "${{ steps.board_meta.outputs.tags }}"
            printf '%s\n' "${{ steps.web_meta.outputs.tags }}"
          } | while IFS= read -r image_ref; do
            test -n "$image_ref" || continue
            verify_ref "$image_ref"
          done

      - name: Dispatch downstream release
        # Deployment follows a real release only. A manual run must never move
        # what is running in production, whatever it was asked to build.
        if: ${{ github.event_name == 'release' && !github.event.release.prerelease && vars.DEPLOY_DISPATCH_REPOSITORY != '' }}
        env:
          DEPLOY_DISPATCH_REPOSITORY: ${{ vars.DEPLOY_DISPATCH_REPOSITORY }}
          DEPLOY_DISPATCH_EVENT_TYPE: ${{ vars.DEPLOY_DISPATCH_EVENT_TYPE || 'symphony-board-release' }}
          DEPLOY_DISPATCH_WORKFLOW: ${{ vars.DEPLOY_DISPATCH_WORKFLOW }}
          DEPLOY_DISPATCH_TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_DISPATCH_TOKEN" || {
            echo "DEPLOY_DISPATCH_TOKEN is required when DEPLOY_DISPATCH_REPOSITORY is set" >&2
            exit 1
          }
          test -n "$DEPLOY_DISPATCH_WORKFLOW" || {
            echo "DEPLOY_DISPATCH_WORKFLOW is required when DEPLOY_DISPATCH_REPOSITORY is set" >&2
            exit 1
          }
          case "$DEPLOY_DISPATCH_REPOSITORY" in
            */*) ;;
            *) echo "DEPLOY_DISPATCH_REPOSITORY must be owner/repo" >&2; exit 1 ;;
          esac
          version="${RELEASE_TAG#v}"
          payload="$(
            jq -nc \
              --arg event_type "$DEPLOY_DISPATCH_EVENT_TYPE" \
              --arg version "$version" \
              --arg tag "$RELEASE_TAG" \
              --arg source_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG" \
              --arg run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              --arg run_id "$GITHUB_RUN_ID" \
              --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
              '{event_type: $event_type, client_payload: {version: $version, tag: $tag, source_url: $source_url, run_url: $run_url, run_id: $run_id, run_attempt: $run_attempt}}'
          )"
          printf '%s' "$payload" |
            DISPATCH_TOKEN="$DEPLOY_DISPATCH_TOKEN" \
            DISPATCH_EXPECT_WORKFLOW="$DEPLOY_DISPATCH_WORKFLOW" \
            DISPATCH_EXPECT_RUN_NAME="$DEPLOY_DISPATCH_EVENT_TYPE $version from $GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT" \
            scripts/ci/dispatch-release.sh "$DEPLOY_DISPATCH_REPOSITORY"

  desktop:
    name: build unsigned macOS apps (${{ matrix.arch }})
    needs: version-gate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-26
            target: aarch64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          # On a manual run the triggering ref is a branch; the tag is the
          # input. Fully qualified, so a BRANCH named like the tag can never be
          # resolved here -- `tag` is free text and this ref is what gets built.
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package unsigned desktop apps
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          scripts/package-desktop-release.sh \
            --version "$version" \
            --target "${{ matrix.target }}" \
            --out-dir dist/release

      - name: Upload desktop release assets
        # Built either way, uploaded only for a run that is publishing: a manual
        # run proves packaging without clobbering a live release's assets.
        if: ${{ env.PUBLISH == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$RELEASE_TAG" dist/release/* --repo "$GITHUB_REPOSITORY" --clobber

  # The release is complete or it is not, and this job is where that is decided.
  #
  # Until now the answer lived on a developer's machine: `release.sh --execute`
  # created the Release and then blocked on `gh run watch` for the tens of minutes
  # the arm64 build takes, verifying GHCR and the desktop assets afterwards. That
  # wait is the fragile part -- it was killed repeatedly by a local supervisor and
  # left releases published but unverified, with no supported way to finish them
  # until `--resume` existed.
  #
  # CI already verifies the GHCR manifests inside `publish`. The only thing it did
  # not check was that the desktop assets actually reached the Release, which is
  # the other half of what the local wait was for. Checking it here makes a green
  # run mean "complete", so nothing has to sit and watch.
  release-complete:
    name: verify the release carries every artifact
    needs: [publish, desktop]
    # NOT `env.PUBLISH`: the env context is unavailable in a job-level `if`, so
    # that reads as empty and skips the job silently -- which would disable the
    # check this job exists to add while looking correct. Spelled out instead.
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Verify desktop release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          version="${RELEASE_TAG#v}"
          missing=0
          names="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"

          for asset in \
            "Symphony-Board-v${version}-macos-arm64-unsigned.zip" \
            "Symphony-Board-Standalone-v${version}-macos-arm64-unsigned.zip" \
            "SHA256SUMS-v${version}-macos-arm64.txt"; do
            if printf '%s\n' "$names" | grep -Fxq -- "$asset"; then
              echo "verified release asset: $asset"
            else
              echo "MISSING release asset: $asset" >&2
              missing=1
            fi
          done

          test "$missing" -eq 0 || {
            echo "release $RELEASE_TAG is incomplete: desktop assets are missing" >&2
            exit 1
          }

          echo "release $RELEASE_TAG carries every expected artifact"

  homebrew-tap:
    name: dispatch Homebrew cask update
    needs:
      - publish
      - desktop
    if: ${{ github.event_name == 'release' && !github.event.release.prerelease && vars.HOMEBREW_TAP_DISPATCH_REPOSITORY != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Top-level permissions are `{}`, so this job needs its own read grant for
    # the checkout that puts scripts/ci/dispatch-release.sh on disk.
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          # On a manual run the triggering ref is a branch; the tag is the
          # input. Fully qualified, so a BRANCH named like the tag can never be
          # resolved here -- `tag` is free text and this ref is what gets built.
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Dispatch Homebrew tap cask update
        env:
          HOMEBREW_TAP_DISPATCH_REPOSITORY: ${{ vars.HOMEBREW_TAP_DISPATCH_REPOSITORY }}
          HOMEBREW_TAP_DISPATCH_EVENT_TYPE: ${{ vars.HOMEBREW_TAP_DISPATCH_EVENT_TYPE || 'symphony-board-release' }}
          HOMEBREW_TAP_DISPATCH_TOKEN: ${{ secrets.HOMEBREW_TAP_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$HOMEBREW_TAP_DISPATCH_TOKEN" || {
            echo "HOMEBREW_TAP_DISPATCH_TOKEN is required when HOMEBREW_TAP_DISPATCH_REPOSITORY is set" >&2
            exit 1
          }
          case "$HOMEBREW_TAP_DISPATCH_REPOSITORY" in
            */*) ;;
            *) echo "HOMEBREW_TAP_DISPATCH_REPOSITORY must be owner/repo" >&2; exit 1 ;;
          esac
          version="${RELEASE_TAG#v}"
          payload="$(
            jq -nc \
              --arg event_type "$HOMEBREW_TAP_DISPATCH_EVENT_TYPE" \
              --arg version "$version" \
              --arg tag "$RELEASE_TAG" \
              --arg source_repo "$GITHUB_REPOSITORY" \
              --arg source_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG" \
              --arg run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              '{event_type: $event_type, client_payload: {version: $version, tag: $tag, source_repo: $source_repo, source_url: $source_url, run_url: $run_url}}'
          )"
          printf '%s' "$payload" |
            DISPATCH_TOKEN="$HOMEBREW_TAP_DISPATCH_TOKEN" \
            scripts/ci/dispatch-release.sh "$HOMEBREW_TAP_DISPATCH_REPOSITORY"
