name: security

# SCA — dependency & container scanning (Trivy + dependency-review). Public repo
# → free; SARIF lands in Security → Code scanning. Findings are report-only
# (exit-code 0 / warn-only); a failed image build or scan still fails its job.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Diff-based SCA on PRs: flags vulnerable / disallowed-license deps NEWLY
  # introduced by the PR itself. warn-only → posts a summary, never fails.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # write scope is only so the action can post its summary comment; with
      # warn-only it never fails the check (it does not gate the PR).
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - name: Dependency review
        uses: actions/dependency-review-action@v5
        with:
          warn-only: true
          comment-summary-in-pr: on-failure

  # Lockfile + IaC scan of the whole tree: pnpm-lock.yaml AND the three
  # Cargo.lock files (Trivy's cargo support uses RustSec/GHSA advisories, so the
  # Tauri crates are covered here too), plus Dockerfile misconfig and leaked
  # secrets. Report-only via exit-code 0.
  trivy-fs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln,misconfig,secret
          format: sarif
          output: trivy-fs.sarif
          exit-code: "0" # report-only
          severity: CRITICAL,HIGH,MEDIUM
          trivyignores: .trivyignore.yaml
      # Fork PRs lack a write token, so the upload is skipped there (the scan
      # still runs and shows in the job log).
      - name: Upload Trivy fs SARIF
        if: ${{ !cancelled() && github.event.pull_request.head.repo.fork != true }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  # Scan images built from main so the dashboard tracks source fixes without
  # publishing a release. Scheduled runs also recheck the current tree against
  # fresh package and advisory data. Keep the existing SARIF categories.
  trivy-image:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - ref: "ghcr.io/${{ github.repository }}:scan"
            dockerfile: docker/Dockerfile
            category: trivy-image-board
          - ref: "ghcr.io/${{ github.repository }}-web:scan"
            dockerfile: docker/ui.Dockerfile
            category: trivy-image-web
    steps:
      - uses: actions/checkout@v7
      - name: Build image for scanning
        env:
          IMAGE_REF: ${{ matrix.image.ref }}
          DOCKERFILE: ${{ matrix.image.dockerfile }}
        run: docker build --file "$DOCKERFILE" --tag "$IMAGE_REF" .
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_IMAGE_SRC: docker
        with:
          scan-type: image
          image-ref: ${{ matrix.image.ref }}
          format: sarif
          output: trivy-image.sarif
          exit-code: "0" # report-only (vulnerability findings)
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          trivyignores: .trivyignore.yaml
      - name: Upload Trivy image SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-image.sarif
          category: ${{ matrix.image.category }}
